<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedAssist AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="static/style.css">
    <script src="static/script.js" defer></script>
</head>
<body>

<!-- navigation bar visuals -->
<nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand">MedAssist AI</a>
        <div class="d-flex gap-2">
            <a href="#" class="nav-btn">Home</a>
            <a href="#" class="nav-btn">Patient Account</a>
            <a href="#" class="nav-btn">Reports</a>
            <a href="#" class="nav-btn">Settings</a>
            <a href="#" class="nav-btn">Help</a>
        </div>
    </div>
</nav>

<!-- container for uploading an image and receiving output -->
<div class="container text-center mt-4">
    <h2 class="mb-4">Select a file to upload</h2>

    <!-- box for uploading images -->
    <div class="upload-box">
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="file-input" name="file" class="form-control mb-2" accept="image/*" required>
            <img id="prediction-image" class="img-fluid rounded shadow mt-2" style="display: none; max-width: 100%;" alt="Prediction Result">
            <button type="submit" class="btn btn-primary mt-3">Predict</button>
            <div class="spinner-border text-primary mt-3" role="status"></div>
        </form>
    </div>

    <!-- displaying output -->
    <div id="prediction-container" class="mt-4"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
