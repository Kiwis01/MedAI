<!DOCTYPE html>
<html>
<head>
    <title>Flask AI Image Prediction</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="static/script.js" defer></script>
</head>
<body>
    <main class="container">
        <h2>Select a file to upload</h2>
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="file-input" name="file" class="form-control" required>
            <input type="submit" value="Predict" class="btn btn-info">
        </form>

        <h2>Prediction</h2>
        <div id="prediction-container" style="display: none;">
            <img id="prediction-image" src="" alt="Prediction Result" class="img-responsive">
        </div>
    </main>
</body>
</html>
