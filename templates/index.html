<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedAssist AI</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* color palette */
        :root {
            --light-gray: #E0E0E0;
            --medium-gray: #B0B0B0;
            --dark-blue: #003049;
            --light-blue: #BDE0FE;
            --text-dark: #000000;
            --white: #FFFFFF;
        }

        body {
            background-color: var(--white);
            color: var(--text-dark);
            font-family: Arial, sans-serif;
        }

        /* navigation bar */
        .navbar {
            background-color: var(--dark-blue);
            padding: 10px 20px;
        }
        .navbar-brand {
            font-weight: bold;
            color: white;
            font-size: 1.5rem;
        }

        /* upload box */
        .upload-box {
            border: 2px dashed var(--dark-blue);
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            background-color: var(--light-blue);
        }

        /* upload button */
        .btn-primary {
            background-color: var(--light-gray);
            border: none;
            color: black;
        }
        .btn-primary:hover {
            background-color: var(--dark-blue);
            color: white;
        }

        /* loading circle */
        .spinner-border {
            display: none;
        }

        /* prediction result */
        #prediction-container {
            display: none;
        }
    </style>
    <script src="static/script.js" defer></script>
</head>
<body>

<!-- navigation bar visuals -->
<nav class="navbar navbar-expand-lg shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand">MedAssist AI</a>
        <div class="d-flex gap-2">
            <a href="#" class="nav-btn">Home</a>
            <a href="#" class="nav-btn">Patient Account</a>
            <a href="#" class="nav-btn">Reports</a>
            <a href="#" class="nav-btn">Settings</a>
            <a href="#" class="nav-btn">Help</a>
        </div>
    </div>
</nav>

<!-- container for uploading an image and receiving output -->
<div class="container text-center mt-4">
    <h2 class="mb-4">Select a file to upload</h2>

    <!-- box for uploading images -->
    <div class="upload-box">
        <form id="upload-form" enctype="multipart/form-data">
            <input type="file" id="file-input" name="file" class="form-control mb-2" accept="image/*" required>
            <img id="prediction-image" class="img-fluid rounded shadow mt-2" style="display: none; max-width: 100%;" alt="Prediction Result">
            <button type="submit" class="btn btn-primary mt-3">Predict</button>
            <div class="spinner-border text-primary mt-3" role="status"></div>
        </form>
    </div>

    <!-- displaying output -->
    <div id="prediction-container" class="mt-4"></div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("upload-form").addEventListener("submit", function (event) {
            event.preventDefault(); // Prevent page refresh

            let formData = new FormData();
            let fileInput = document.getElementById("file-input");
            if (fileInput.files.length === 0) {
                alert("Please select an image first!");
                return;
            }

            formData.append("file", fileInput.files[0]);

            document.querySelector(".spinner-border").style.display = "inline-block";  

            fetch("/upload", {
                method: "POST",
                body: formData,
            })
            .then(response => response.json())
            .then(data => {
                document.querySelector(".spinner-border").style.display = "none";  

                if (data.error) {
                    alert(data.error);
                } else {
                    document.getElementById("prediction-image").src = data.predicted;
                    document.getElementById("prediction-image").style.display = "block";
                    document.getElementById("prediction-container").style.display = "block";
                }
            })
            .catch(error => {
                document.querySelector(".spinner-border").style.display = "none";  
                console.error("Error:", error);
            });
        });
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
